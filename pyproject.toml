[project]
name = "grafana-dashboards"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pradeep Kumar", email = "pradeep@ensaras.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
grafana-dashboards = "grafana_dashboards:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
